- defaults:
    create:
      mode: 0755
    link:
      backup: true
      relink: true
      force: true
      create: true

- clean:
    "~":
    ~/.agents/skills:
    ~/.agents:
    ~/.claude/output-styles:
    ~/.claude/skills:
    ~/.claude:
    ~/.codex:
    ~/.config/opencode/skills:
    ~/.config:
    ~/.ssh:
    "~/Library/Application Support/Code/User":
    ~/Library/LaunchAgents:

- create:
    ~/.agents:
    ~/.agents/skills:
    ~/.claude:
    ~/.claude/skills:
    ~/.ssh:
      mode: 0700
    ~/projects:

- shell:
    - command: git submodule update --init --recursive --remote
      description: Initialize, clone, and update all submodules (including nested ones) —
    # `~/.config/opencode/skills` used to be a single symlink to the repo directory. The link
    # section below now links its children individually, which would write straight into the repo
    # through that old symlink, so drop it first.
    - command: '[ ! -L "$HOME/.config/opencode/skills" ] || rm "$HOME/.config/opencode/skills"'
      description: Drop the legacy ~/.config/opencode/skills directory symlink —

- link:
    # Files in $HOME root.
    ~/.Brewfile: home/.Brewfile
    ~/.gitconfig: home/.gitconfig
    ~/.zlogin: home/.zlogin
    ~/.zprofile: home/.zprofile
    ~/.zshenv: home/.zshenv
    ~/.zshrc: home/.zshrc

    # Files.
    ~/.agents/.skill-lock.json: home/.agents/.skill-lock.json
    ~/.aws/config: home/.aws/config
    ~/.codex/AGENTS.md: home/.config/opencode/AGENTS.md
    ~/.config/git/ignore: home/.config/git/ignore
    ~/.ssh/config: home/.ssh/config
    "~/Library/Application Support/Code/User/settings.json":
      path: "home/.config/Code/User/settings.json"
      if: '[[ "$(uname)" == "Darwin" ]]'
    "~/Library/Application Support/rtk/":
      glob: true
      path: "home/.config/rtk/*"
      if: '[[ "$(uname)" == "Darwin" ]]'
    "~/.config/Code/User/settings.json":
      path: "home/.config/Code/User/settings.json"
      if: '[[ "$(uname)" == "Linux" ]]'
    "~/.config/rtk/":
      glob: true
      path: "home/.config/rtk/*"
      if: '[[ "$(uname)" == "Linux" ]]'

    # Directories.
    ~/.agents/skills/:
      glob: true
      path: home/.agents/skills/*
    # The excluded entries are managed by scripts/update-coding-agents/sync-gentle-ai-assets.sh
    # instead of Dotbot — see docs/coding-agents.md.
    ~/.claude/:
      glob: true
      path: home/.claude/*
      exclude:
        - home/.claude/CLAUDE.md
        - home/.claude/output-styles
        - home/.claude/settings.json
    # Globs skip dotfiles, so hidden files inside globbed directories need explicit links.
    ~/.claude/.shellcheckrc: home/.claude/.shellcheckrc
    # `~/.claude/output-styles` is also written by gentle-ai, so link its children individually
    # rather than symlinking the directory — a directory symlink would make gentle-ai write its
    # own styles straight into this repo.
    ~/.claude/output-styles/:
      glob: true
      path: home/.claude/output-styles/*
    ~/.claude/skills/:
      glob: true
      path: home/.agents/skills/*
    ~/.config/ghostty: home/.config/ghostty/
    ~/.config/mise: home/.config/mise/
    ~/.config/opencode/:
      glob: true
      path: home/.config/opencode/*
      exclude:
        - home/.config/opencode/AGENTS.md
        - home/.config/opencode/opencode.json
        - home/.config/opencode/skills
    ~/.config/opencode/skills/:
      glob: true
      path: home/.config/opencode/skills/*
    ~/.config/wezterm: home/.config/wezterm/

- shell:
    - command: ./scripts/configure-touch-id-for-sudo.sh
      description: Enable Touch ID for sudo (/etc/pam.d/sudo_local) —
      stdout: true
      stderr: true
    - command: ./scripts/install-os-packages.sh
      description: Install OS packages (Homebrew, Mise) —
      stdout: true
      stderr: true
    - command: ./scripts/set-brew-zsh-as-default-shell.sh
      description: Set the Homebrew Zsh as the default shell —
      stdout: true
      stderr: true
