[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
bun = "latest"
"cargo:eza" = "latest"
codex = "latest"
delta = "latest"
gh = "latest"
herdr = "latest"
just = "latest"
llmfit = "latest"
node = "lts"
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = true }
opencode = "latest"
python = ["latest", "3.12"]
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
"uv" = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }

[settings]
env_file = '.env'
idiomatic_version_file_enable_tools = ["python", "node"]
minimum_release_age = "0s"
